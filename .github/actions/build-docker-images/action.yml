name: Build Images
description: Build backend & frontend docker images

inputs:
  app-name:
    description: The name of the App being built (frontend or backend)
    required: true
  dockerfile-path:
    description: Path to the Dockerfile of the app
    required: true
  actor:
    description: Value of `github.actor`
    required: true
  token:
    description: Value of `secrets.GITHUB_TOKEN`
    required: true
  digitalocean-email:
    description: Registered Email on DigitalOcean
    required: true
  digitalocean-access-token:
    description: The DigitalOcean API token
    required: true

runs:
  using: composite
  steps:
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: registry.digitalocean.com
        username: ${{ inputs.digitalocean-email }}
        password: ${{ inputs.digitalocean-access-token }}

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}-${{ inputs.app-name }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=short

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ inputs.dockerfile-path }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
