name: Tool setup action
description: Sets up all tools required for interacting with the codebase

inputs:
  node-version:
    description: Version Node used in this project
    default: lts/*
  uv-version:
    description: Version of UV used in this project
    default: 0.10.6
  python-version:
    description: Version of Python used in this project
    default: "3.12"
  tflint-version:
    description: Version of TFLint used in this project (Prefix with v)
    default: 0.61.0

runs:
  using: composite
  steps:
    - name: Setup PNPM
      uses: pnpm/action-setup@v4
      with:
        cache: true

    - name: Setup Nodejs
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
        cache: "pnpm"

    - name: Setup UV
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ inputs.uv-version }}

    - name: Install Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v6
      with:
        tflint_version: ${{ inputs.tflint-version }}
        cache: true
